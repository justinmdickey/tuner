server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be served stale, or installed clients can be
    # pinned to an old shell forever. Everything else is fine to cache since a
    # CACHE bump in sw.js is what triggers a refresh.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }

    # getUserMedia needs a secure context (Traefik terminates TLS) and this app
    # talks to nothing off-origin, so lock it down.
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()";

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
}
