# Build and publish entirely within the homelab — nothing here reaches github.com,
# including the `uses:` lines, which resolve against code.forgejo.org.
#
# Runs on the self-hosted runner `nimbus-worker` (Proxmox VM 125, joined to the
# Tardis k3s cluster). Ported from .github/workflows/docker-build.yml following
# the pattern documented for booky/quilt_planning in kubernetes-homelab's
# docs/06-ci-and-runners.md.
#
# Differences from the GitHub workflow this replaces, all forced rather than
# chosen:
#
# * Registry is Forgejo's own, `git.erisdor.com/justin`. The image name
#   is hardcoded rather than derived from github.repository, so a repo rename
#   can't silently move the published image out from under the Deployment.
# * `secrets.GITHUB_TOKEN` is NOT usable for the registry — Forgejo's job token
#   has no package scope, so the push would fail with
#   `401 Unauthorized: reqPackageAccess`. REGISTRY_TOKEN is a `write:package`
#   token stored as an Actions secret on this repo.
# * `cache-from/to: type=gha` was a GitHub-hosted service. Dropped rather than
#   replaced: `type=registry` against a `:buildcache` tag fails the whole build
#   on a cache MISS here, which the first build always is.
# * `runs-on: ubuntu-latest` resolves to a plain `node:22-bookworm` on this
#   runner, not a GitHub runner image — nothing is preinstalled. `oven-sh/setup-bun`
#   isn't mirrored on code.forgejo.org, so bun is installed via its own install
#   script instead of that action. The docker client is likewise installed
#   explicitly; buildx itself still comes from setup-buildx-action, and dockerd
#   runs in the runner pod's sidecar.
# * `bun test --smol`: kept as cheap insurance, though neither thing that broke
#   this build was bun's heap. First, the runner pod's own cgroups were too
#   small — dind at 2Gi and act_runner at 512Mi, killed together; Forgejo
#   reports that as a *cancelled* run with a truncated log and no error, which
#   reads like a workflow bug (raised in kubernetes-homelab #40, along with the
#   worker VM going 4 GB -> 6 GB). Second, and the real blocker: VM 125 had no
#   `cpu:` line in its Proxmox config, so it ran the default kvm64 model, which
#   exposes no AVX. Bun requires it and died with SIGILL — "CPU lacks AVX
#   support" immediately before the segfault. Fixed with `qm set 125 -cpu host`
#   plus a full stop/start. Any future worker VM needs `cpu: host` from birth.
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  IMAGE: git.erisdor.com/justin/tuner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        run: |
          set -eu
          apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip ca-certificates >/dev/null
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # There is no microphone in CI, so the detector is validated against
      # synthesized string tones. Gate the image build on it.
      # --smol trades GC frequency for a smaller heap. See the header: the real
      # fix was raising the runner pod's memory limits, not this flag.
      - name: Run pitch detection tests
        run: bun test --smol

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The job image ships no docker client, so every docker/* action fails with
      # "Unable to locate executable file: docker" even though the daemon's socket
      # is mounted in. Only the client is needed.
      - name: Install the docker CLI
        run: |
          set -eu
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.7.1.tgz \
            | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          docker version --format '{{.Client.Version}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: git.erisdor.com
          username: justin
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
